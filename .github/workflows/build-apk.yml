name: Build debug APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: build debug arm64
        working-directory: app
        run: flutter build apk --debug --flavor arm64 -t lib/main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-debug-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

